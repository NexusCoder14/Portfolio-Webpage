<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link><link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login_button">
        <p>Login</p>
    </div>
    <div id="email">
        <a id="email_enter"><input type="text">Enter email</a>
    </div>
    <div id="password">
        <a id="textbox"><input type="password">Enter Password</a>
    </div>
    <div id="buttons">
        <a id="button"><button>Forgot Password</button></a>
        <a id="button"><button>Enter</button></a>
    </div>
    <script src="script.js"></script>
    <script type="text/javascript">
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
</body>
</html>
